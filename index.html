<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Star Coffee App</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f2eb;margin:0;color:#222}
header{background:#49301f;color:white;padding:18px;text-align:center}
main{max-width:520px;margin:auto;padding:16px}
.card{background:white;border-radius:12px;padding:18px;margin:12px 0;box-shadow:0 2px 8px #ddd}
input,select,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border-radius:8px;border:1px solid #ccc;font-size:16px}
button{background:#49301f;color:white;border:0;font-weight:bold}
button:disabled{opacity:.5}
.secondary{background:#777}
.hidden{display:none}
h2{color:#49301f}
small{color:#666}
.order-row{padding:12px 0;border-bottom:1px solid #eee}
.cancel-order{width:auto;display:block;background:#9c3026}
.cancelled{display:block;color:#9c3026;font-weight:bold;margin-top:6px}
#itemPhoto{display:block;width:96px;height:96px;object-fit:cover;border-radius:8px}
#itemPhoto[hidden]{display:none}
</style>
</head>
<body>
<header><h1>☕ STAR COFFEE</h1><div>Owner &amp; Staff App</div></header>
<main>
<section id="login" class="card">
<h2>Login / ലോഗിൻ</h2>
<select id="role"><option value="owner">Owner</option><option value="staff">Staff</option></select>
<input id="username" placeholder="Username">
<input id="pin" type="password" inputmode="numeric" placeholder="PIN">
<button onclick="login()">Login</button>
<p id="error"></p>
<small>Demo Owner: owner / <br>Demo Staff: staff / 5678</small>
</section>
<section id="app" class="hidden">
<div class="card">
<h2 id="welcome"></h2>
<button class="secondary" onclick="logout()">Logout</button>
</div>
<div class="card">
<h2>🧾 New Order</h2>
<select id="item" aria-label="Menu item"></select>
<img id="itemPhoto" alt="" hidden>
<input id="qty" type="number" min="1" value="1" placeholder="Quantity">
<select id="payment"><option>Cash</option><option>UPI</option></select>
<button onclick="addOrder()">Save Order</button>
</div>
<div id="ownerPanel" class="hidden">
<div class="card">
<h2>📊 Business Dashboard</h2>
<p>Today Sales: ₹<b id="sales">0</b></p>
<p>Today Expenses: ₹<b id="expenses">0</b></p>
<p>Today Profit: ₹<b id="profit">0</b></p>
<small>Profit here means sales minus entered expenses.</small>
</div>
<div class="card">
<h2>💸 Add Expense</h2>
<input id="expenseName" placeholder="Expense name">
<input id="expenseAmount" type="number" min="0.01" step="0.01" placeholder="Amount ₹">
<button onclick="addExpense()">Save Expense</button>
</div>
</div>
<div class="card">
<h2>Recent Orders</h2>
<div id="orders"></div>
</div>
<form id="menuForm" class="card hidden">
<h2>Menu / മെനു</h2>
<label for="menuChoice">Item / ഇനം</label>
<select id="menuChoice"></select>
<label for="menuName">Name / പേര്</label>
<input id="menuName" required maxlength="80">
<label for="menuPrice">Price / വില (₹)</label>
<input id="menuPrice" type="number" min="0.01" step="0.01" required>
<label for="menuPhoto">Picture / ഫോട്ടോ</label>
<input id="menuPhoto" type="file" accept="image/*">
<button id="saveMenu">Save Menu Item / സേവ്</button>
<p id="menuMessage" role="status"></p>
</form>
</section>
</main>
<script>
const KEY = "starCoffeeDemoV1";
const defaultMenu = [
  {name: "Tea", price: 12}, {name: "Coffee", price: 20},
  {name: "Black Coffee", price: 15}, {name: "Snacks", price: 20}
];
const el = id => document.getElementById(id);
let currentRole = "";
let data;

function readData() {
  let stored;
  try {
    stored = JSON.parse(localStorage.getItem(KEY)) || {};
  } catch {
    stored = {};
  }
  return {
    ...stored,
    orders: Array.isArray(stored.orders) ? stored.orders : [],
    expenses: Array.isArray(stored.expenses) ? stored.expenses : [],
    menu: Array.isArray(stored.menu) ? stored.menu : defaultMenu
  };
}

function save(next) {
  try {
    localStorage.setItem(KEY, JSON.stringify(next));
    data = next;
    return true;
  } catch {
    alert("Could not save data");
    return false;
  }
}

function today() {
  const date = new Date();
  return date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0") +
    "-" + String(date.getDate()).padStart(2, "0");
}

function login() {
  const role = el("role").value;
  const user = el("username").value.trim();
  const pin = el("pin").value;
  if (!((role === "owner" && user === "owner" && pin === ||
        (role === "staff" && user === "staff" && pin === "5678"))) {
    el("error").textContent = "Wrong username or PIN";
    return;
  }
  currentRole = role;
  data = readData();
  el("error").textContent = "";
  el("login").classList.add("hidden");
  el("app").classList.remove("hidden");
  el("ownerPanel").classList.toggle("hidden", role !== "owner");
  el("menuForm").classList.toggle("hidden", role !== "owner");
  el("welcome").textContent = role === "owner" ? "Owner Dashboard" : "Staff Dashboard";
  renderMenu();
  render();
}

function logout() {
  currentRole = "";
  el("app").classList.add("hidden");
  el("login").classList.remove("hidden");
  el("pin").value = "";
}

function addOrder() {
  if (!currentRole) return;
  const qty = Number(el("qty").value);
  if (!Number.isInteger(qty) || qty < 1) {
    alert("Enter valid quantity");
    return;
  }
  const item = data.menu[Number(el("item").value)];
  const order = {
    date: today(), item: item.name, qty,
    total: Math.round(item.price * 100) * qty / 100, payment: el("payment").value
  };
  const latest = readData();
  if (save({...latest, orders: [...latest.orders, order]})) {
    render();
    alert("Order saved");
  }
}

function addExpense() {
  if (currentRole !== "owner") return;
  const name = el("expenseName").value.trim();
  const amount = Number(el("expenseAmount").value);
  if (!name || !Number.isFinite(amount) || amount <= 0) {
    alert("Enter valid expense");
    return;
  }
  const latest = readData();
  if (save({...latest, expenses: [...latest.expenses, {date: today(), name, amount}]})) {
    render();
    alert("Expense saved");
  }
}

function orderLabel(order) {
  return order.item + " × " + order.qty + " — ₹" + order.total + " (" + order.payment + ")";
}

function cancelOrder(index, order) {
  if (currentRole !== "owner" || order.cancelledAt) return;
  if (!confirm("Cancel this order?\n" + orderLabel(order))) return;
  const latest = readData();
  const savedOrder = latest.orders[index];
  if (!savedOrder || JSON.stringify(savedOrder) !== JSON.stringify(order)) {
    data = latest;
    render();
    alert("Orders changed. Please review the list.");
    return;
  }
  latest.orders[index] = {...savedOrder, cancelledAt: new Date().toISOString()};
  if (save(latest)) render();
}

function render() {
  const date = today();
  const sales = data.orders.reduce((sum, order) =>
    sum + (order.date === date && !order.cancelledAt ? order.total : 0), 0);
  const costs = data.expenses.filter(expense => expense.date === date)
    .reduce((sum, expense) => sum + expense.amount, 0);
  el("sales").textContent = sales.toFixed(2);
  el("expenses").textContent = costs.toFixed(2);
  el("profit").textContent = (sales - costs).toFixed(2);

  const box = el("orders");
  box.replaceChildren();
  const orders = data.orders.map((order, index) => ({order, index}))
    .filter(({order}) => order.date === date).slice(-10).reverse();
  for (const {order, index} of orders) {
    const row = document.createElement("div");
    row.className = "order-row";
    row.textContent = orderLabel(order);
    if (order.cancelledAt) {
      const status = document.createElement("small");
      status.className = "cancelled";
      status.textContent = "Cancelled / റദ്ദാക്കി";
      row.append(status);
    } else if (currentRole === "owner") {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "cancel-order";
      button.textContent = "Cancel Order";
      button.addEventListener("click", () => cancelOrder(index, order));
      row.append(button);
    }
    box.append(row);
  }
  if (!orders.length) box.textContent = "No orders today";
}

function renderMenu() {
  const selection = el("item").value;
  el("item").replaceChildren(...data.menu.map((item, index) =>
    new Option(item.name + " ₹" + item.price, index)));
  if (selection !== "" && data.menu[Number(selection)]) el("item").value = selection;
  el("menuChoice").replaceChildren(new Option("Add New Item / പുതിയ ഇനം", ""),
    ...data.menu.map((item, index) => new Option(item.name, index)));
  showItemPhoto();
  editMenuItem();
}

function showItemPhoto() {
  const item = data.menu[Number(el("item").value)];
  const photo = el("itemPhoto");
  photo.hidden = !item?.photo;
  if (item?.photo) photo.src = item.photo;
  else photo.removeAttribute("src");
}

function editMenuItem() {
  const selection = el("menuChoice").value;
  const item = selection === "" ? null : data.menu[Number(selection)];
  el("menuName").value = item?.name ?? "";
  el("menuPrice").value = item?.price ?? "";
  el("menuPhoto").value = "";
}

async function resizePhoto(file) {
  const url = URL.createObjectURL(file);
  try {
    const image = new Image();
    image.src = url;
    await image.decode();
    const scale = Math.min(1, 360 / Math.max(image.naturalWidth, image.naturalHeight));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
    const context = canvas.getContext("2d");
    context.fillStyle = "#fff";
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(image, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL("image/jpeg", 0.75);
  } finally {
    URL.revokeObjectURL(url);
  }
}

el("item").addEventListener("change", showItemPhoto);
el("menuChoice").addEventListener("change", editMenuItem);
el("menuForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (currentRole !== "owner") return;
  const name = el("menuName").value.trim();
  const price = Number(el("menuPrice").value);
  const selection = el("menuChoice").value;
  const file = el("menuPhoto").files[0];
  const message = el("menuMessage");
  if (!name || !Number.isFinite(price) || price <= 0) {
    message.textContent = "Enter a name and valid price.";
    return;
  }
  const button = el("saveMenu");
  button.disabled = true;
  let photo;
  try {
    if (file) photo = await resizePhoto(file);
    if (currentRole !== "owner") return;
    const latest = readData();
    const menu = latest.menu.slice();
    const index = selection === "" ? menu.length : Number(selection);
    menu[index] = {...menu[index], name, price};
    if (photo) menu[index].photo = photo;
    if (save({...latest, menu})) {
      renderMenu();
      message.textContent = "Menu item saved / സേവ് ചെയ്തു";
    }
  } catch {
    message.textContent = "Could not open this picture. Try a JPEG or PNG.";
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</
